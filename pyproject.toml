[tool.poetry]
name = "pyrobotics"
version = "0.1.0"
description = "Python-based robotics playground with optional ROS2 integration"
authors = ["Alexander Schiendorfer"]
readme = "README.md"
packages = [{ include = "pyrobotics", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.26"
scipy = "^1.13"
matplotlib = "^3.9"
spatialmath-python = "^1.1"
roboticstoolbox-python = "^1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"

[tool.poetry.extras]
# Install these when ROS2 is available on the system
ros2 = []

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
